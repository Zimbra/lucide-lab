version: 2.1

############################################################################

executors:
  node-executor:
    working_directory: ~/lucide-lab
    docker:
      - image: cimg/node:20.20.0
    resource_class: small

env-context: &env-context
  context:
    - npm-js


############################################################################
# Cache node_modules
restore-dependencies-cache: &restore-dependencies-cache
  restore_cache:
    keys:
      - v1-dependencies-{{ .Branch }}-{{ checksum "package.json" }}--{{ checksum "packages/lab/package.json" }}
      # fallback to using the cache from the same branch
      - v1-dependencies-{{ .Branch }}-
      # fallback to using the latest cache if no exact match is found
      - v1-dependencies-

save-dependencies-cache: &save-dependencies-cache
  save_cache:
    paths:
      - node_modules
      - packages/lab/node_modules
    key: v1-dependencies-{{ .Branch }}-{{ checksum "package.json" }}

persist-workspace: &persist-workspace
  persist_to_workspace:
    root: ~/
    paths:
      - lucide-lab

attach-workspace: &attach-workspace
  attach_workspace:
    at: ~/

feature-branch: &feature-branch
  filters:
    branches:
      ignore:
        - /(custom_)?release\/.*/


############################################################################
# COMMANDS
############################################################################

commands:
  remove-node-modules:
    description: Remove node_modules before workspace persist

    steps:
      - run:
          name: Remove node_modules before workspace persist
          command: |
            rm -rf node_modules
            rm -rf packages/lab/node_modules

############################################################################
# JOBS
############################################################################

jobs:

  build:
    executor: node-executor
    steps:
      - checkout

      - *restore-dependencies-cache

      - run:
          name: Install dependencies
          command: |
            npm install
            cd packages/lab
            npm install

      - *save-dependencies-cache

      - run:
          name: Build project
          command: |
            cd packages/lab
            npm run build

      - remove-node-modules

      - *persist-workspace


  publish:
    executor: node-executor
    steps:
      - *attach-workspace

      - *restore-dependencies-cache

      - run:
          name: Setup npm authentication
          command: |
            echo "//registry.npmjs.org/:_authToken=${NPM_PUBLISH_TOKEN}" > ~/.npmrc

      - run:
          name: Set dynamic prerelease version (no git tag)
          command: |
            SAFE_BRANCH=$(echo "$CIRCLE_BRANCH" | sed 's/\//-/g')
            SHORT_SHA=$(echo "$CIRCLE_SHA1" | cut -c1-7)

            cd packages/lab

            npm version prerelease \
              --preid="${SAFE_BRANCH}.${SHORT_SHA}" \
              --no-git-tag-version

      - run:
          name: Publish to npm
          command: |
            cd packages/lab

            SAFE_BRANCH=$(echo "$CIRCLE_BRANCH" | sed 's/\//-/g')
            if [ "$SAFE_BRANCH" = "zimbra" ]; then
              npm publish --access public --tag beta
            else
              npm publish --access public --tag next
            fi

############################################################################
# WORKFLOWS
############################################################################

workflows:
  version: 2

  build-and-publish:
    jobs:
      - build:
          <<: *feature-branch

      - publish-approval:
          <<: *feature-branch
          type: approval
          requires:
            - build

      - publish:
          <<: *feature-branch
          <<: *env-context
          requires:
            - publish-approval